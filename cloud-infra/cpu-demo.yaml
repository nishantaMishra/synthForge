AWSTemplateFormatVersion: '2010-09-09'
Description: One private CPU text worker, queue wake-up, and demo expiry control
Parameters:
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  WorkerImageUri:
    Type: String
    AllowedPattern: '[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9_./:-]+'
  OllamaImageUri:
    Type: String
    AllowedPattern: '[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9_./:-]+'
  BucketName:
    Type: String
  BucketArn:
    Type: String
  QueueUrl:
    Type: String
  QueueArn:
    Type: String
  JobsTableName:
    Type: String
  JobsTableArn:
    Type: String
  WebApiId:
    Type: String
  DemoExpiresAt:
    Type: String
    AllowedPattern: '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z'
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.87.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.87.1.0/24
      MapPublicIpOnLaunch: true
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref Subnet
  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound access; worker reaches AWS and model downloads
      VpcId: !Ref Vpc
      SecurityGroupIngress: []
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: synth-worker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub '${BucketArn}/*'
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !Ref QueueArn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !Ref JobsTableArn
              - Effect: Allow
                Action: ec2:StopInstances
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition:
                  StringEquals:
                    'ec2:ResourceTag/SynthDeployment': !Ref AWS::StackName
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/*'
              - Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Ref AWS::StackId
  WorkerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref WorkerRole]}
  CpuInstance:
    Type: AWS::EC2::Instance
    DependsOn: [DefaultRoute, SubnetRoute]
    CreationPolicy:
      ResourceSignal: {Count: 1, Timeout: PT30M}
    Properties:
      ImageId: !Ref AmiId
      InstanceType: m7i.xlarge
      IamInstanceProfile: !Ref WorkerProfile
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref WorkerSecurityGroup]
      InstanceInitiatedShutdownBehavior: stop
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 40
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - {Key: Name, Value: synth-forge-cpu-demo}
        - {Key: SynthDeployment, Value: !Ref AWS::StackName}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          systemd-run --unit=synth-first-boot-limit --on-active=45m /usr/sbin/shutdown -h now
          fail_boot() {
            aws cloudformation signal-resource --region '${AWS::Region}' --stack-name '${AWS::StackId}' --logical-resource-id CpuInstance --unique-id "$instance_id" --status FAILURE || true
            shutdown -h now
          }
          trap fail_boot ERR
          instance_id=unknown
          dnf install -y docker
          systemctl enable --now docker
          token=$(curl -fsS -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 300' http://169.254.169.254/latest/api/token)
          instance_id=$(curl -fsS -H "X-aws-ec2-metadata-token: $token" http://169.254.169.254/latest/meta-data/instance-id)
          registry='${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com'
          aws ecr get-login-password --region '${AWS::Region}' | docker login --username AWS --password-stdin "$registry"
          docker pull '${WorkerImageUri}'
          docker pull '${OllamaImageUri}'
          mkdir -p /var/lib/synth/ollama /etc/synth
          docker run -d --name synth-ollama --network host --memory 12g --cpus 4 -e OLLAMA_HOST=127.0.0.1:11434 -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_MAX_LOADED_MODELS=1 -v /var/lib/synth/ollama:/root/.ollama '${OllamaImageUri}'
          for attempt in $(seq 1 60); do
            if docker exec synth-ollama ollama list; then break; fi
            sleep 2
          done
          timeout 1200 docker exec synth-ollama ollama pull llama3.2:3b
          cat > /etc/synth/worker.env <<ENV
          AWS_REGION=${AWS::Region}
          CLOUD_QUEUE_URL=${QueueUrl}
          CLOUD_JOBS_TABLE=${JobsTableName}
          CLOUD_BUCKET=${BucketName}
          CLOUD_INSTANCE_ID=$instance_id
          CLOUD_COMPUTE_MODE=cpu-text
          CLOUD_IDLE_SECONDS=300
          CLOUD_JOB_SECONDS=900
          CLOUD_START_SECONDS=600
          ENV
          chmod 600 /etc/synth/worker.env
          cat > /usr/local/bin/synth-cpu-run <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          docker start synth-ollama
          exec docker run --rm --name synth-cpu-worker --network host --memory 512m --cpus 0.5 --env-file /etc/synth/worker.env '${WorkerImageUri}'
          SCRIPT
          chmod 755 /usr/local/bin/synth-cpu-run
          cat > /etc/systemd/system/synth-cpu.service <<'UNIT'
          [Unit]
          Description=Synth Forge CPU queue worker
          After=docker.service network-online.target
          Wants=network-online.target
          Requires=docker.service
          [Service]
          Type=simple
          ExecStart=/usr/local/bin/synth-cpu-run
          ExecStop=-/usr/bin/docker stop -t 15 synth-cpu-worker
          ExecStopPost=/usr/sbin/shutdown -h now
          TimeoutStopSec=30
          [Install]
          WantedBy=multi-user.target
          UNIT
          cat > /etc/systemd/system/synth-session-limit.service <<'UNIT'
          [Unit]
          Description=Stop the CPU demo after the session time limit
          [Service]
          Type=oneshot
          ExecStart=/usr/sbin/shutdown -h now
          UNIT
          cat > /etc/systemd/system/synth-session-limit.timer <<'UNIT'
          [Unit]
          Description=Limit each CPU boot to 45 minutes
          [Timer]
          OnBootSec=45min
          Unit=synth-session-limit.service
          [Install]
          WantedBy=timers.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now synth-session-limit.timer synth-cpu.service
          aws cloudformation signal-resource --region '${AWS::Region}' --stack-name '${AWS::StackId}' --logical-resource-id CpuInstance --unique-id "$instance_id" --status SUCCESS
          trap - ERR
  ControllerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: synth-control
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:GetQueueAttributes
                Resource: !Ref QueueArn
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'
              - Effect: Allow
                Action: [ec2:StartInstances, ec2:StopInstances]
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${CpuInstance}'
              - Effect: Allow
                Action: apigateway:PATCH
                Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/${WebApiId}'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-control:*'
  ControllerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-control'
      RetentionInDays: 7
  Controller:
    Type: AWS::Lambda::Function
    DependsOn: ControllerLogs
    Properties:
      FunctionName: !Sub '${AWS::StackName}-control'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ControllerRole.Arn
      Timeout: 30
      Environment:
        Variables:
          QUEUE_URL: !Ref QueueUrl
          INSTANCE_ID: !Ref CpuInstance
          WEB_API_ID: !Ref WebApiId
          DEMO_EXPIRES_AT: !Ref DemoExpiresAt
      Code:
        ZipFile: |
          import os
          from datetime import datetime, timezone
          import boto3
          ec2 = boto3.client('ec2')
          sqs = boto3.client('sqs')
          gateway = boto3.client('apigatewayv2')
          def handler(_event, _context):
              instance_id = os.environ['INSTANCE_ID']
              instance = ec2.describe_instances(InstanceIds=[instance_id])['Reservations'][0]['Instances'][0]
              state = instance['State']['Name']
              expires = datetime.fromisoformat(os.environ['DEMO_EXPIRES_AT'].replace('Z', '+00:00'))
              if datetime.now(timezone.utc) >= expires:
                  if state == 'running':
                      ec2.stop_instances(InstanceIds=[instance_id])
                  gateway.update_api(ApiId=os.environ['WEB_API_ID'], DisableExecuteApiEndpoint=True)
                  return {'expired': True}
              depth = sqs.get_queue_attributes(QueueUrl=os.environ['QUEUE_URL'], AttributeNames=['ApproximateNumberOfMessages'])
              if state == 'stopped' and int(depth['Attributes'].get('ApproximateNumberOfMessages', '0')) > 0:
                  ec2.start_instances(InstanceIds=[instance_id])
                  return {'started': True}
              return {'started': False, 'state': state}
  WakeRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - {Arn: !GetAtt Controller.Arn, Id: synth-cpu-control}
  WakePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Controller
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WakeRule.Arn
Outputs:
  CpuInstanceId:
    Value: !Ref CpuInstance
  ControllerFunctionName:
    Value: !Ref Controller
